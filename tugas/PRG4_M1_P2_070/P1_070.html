<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1_070</title>
    <style>
        /* menambahkan gaya css untuk memusatkan konten */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Kalkulator Sederhana</h1>
        <button onclick="mulaiKalkulator()">Mulai Kalkulator</button>
        <h4>P1_070</h4>
        <div id="hasil"></div>
    </div>

    <script>
        function mulaiKalkulator(){
            //meminta input dalam format angka1+angka2 tanpa spasi
            const input = prompt("Masukkan Operasi(contoh: 2+3, 4-1, 5*2, 10/2):");
            if (!input) {
                alert("Operasi dibatalkan!");
                return;
            }
            //regex untuk memisahkan angka dan operasi
            const match = input.match(/^(\d+)([\+\-\*\/])(\d+)$/);

            if (!match) {
                alert("Format input tidak valid! gunakan format: angka1+angka2 .");
                return;
            }

            //menangkap angka pertama, operator, dan angka kedua
            const  angka1 = parseFloat(match[1]);
            const operasi = match[2];
            const  angka2 = parseFloat(match[3]);
            let hasil;

            //melakukan operasi berdasarkan input
            switch (operasi) {
                case '+':
                    hasil = angka1 + angka2;
                    break;
                case '-':
                    hasil = angka1 - angka2;
                    break;
                case '*':
                    hasil = angka1 * angka2;
                    break;
                case '/':
                    if (angka2 === 0) {
                        alert("Tidak bisa membagi dengan nol!.");
                        return;
                    }
                    hasil = angka1 / angka2;
                    break;
                default:
                    alert("Operator tidak dikenali!");
                    return;
            }
            //menampilkan hasil operasi menggunakan alert dan elemen HTML
                    alert(`Hasil: ${hasil}`);

        }
    </script>
</body>
</html>
